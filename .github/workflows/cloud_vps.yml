name: Cloud Linux VPS

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Launch Interactive VPS Terminal
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
