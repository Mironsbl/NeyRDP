name: Cloud Linux VPS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Web Terminal & Tunnel
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ttyd curl wget jq git htop tmux
          
          # Download cloudflared
          sudo wget -q -O /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          
          # Allow runner passwordless sudo for everything
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers
          
          # Start ttyd with -W (writable) dropping straight into bash
          ttyd -p 7681 -W -c admin:admin123 bash &
          sleep 2
          
          # Start Cloudflare Tunnel
          cloudflared tunnel --url http://localhost:7681 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          
          # Wait for tunnel URL
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          
          echo "TUNNEL: $TUNNEL_URL"
          
          # Write to repo branch vps-live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B vps-live
          echo "$TUNNEL_URL" > vps_url.txt
          git add vps_url.txt
          git commit -m "update vps url"
          git push origin vps-live --force

      - name: Keep VPS Alive (Up to 6 Hours)
        run: |
          echo "VPS running..."
          while true; do
            sleep 60
          done
