name: Cloud Linux VPS 24/7

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  launch-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Web Terminal & Cloudflare Tunnel
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ttyd curl wget jq git htop tmux
          
          # Install cloudflared
          sudo wget -q -O /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          
          # Allow runner passwordless sudo
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers
          
          # Start ttyd with bash shell
          nohup ttyd -p 7681 -W /bin/bash > /tmp/ttyd.log 2>&1 &
          sleep 2
          
          # Start Cloudflare Tunnel
          nohup cloudflared tunnel --url http://127.0.0.1:7681 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          
          # Wait for tunnel URL
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          
          echo "ACTIVE TUNNEL: $TUNNEL_URL"
          
          # Commit URL to branch vps-live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B vps-live
          echo "$TUNNEL_URL" > vps_url.txt
          git add vps_url.txt
          git commit -m "update vps url [$(date -u)]" || true
          git push origin vps-live --force

      - name: Keep Alive & Chain Next Runner (24/7 Loop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "VPS is alive and serving web terminal..."
          # Sleep for 5 hours (300 minutes = 18000 seconds)
          # Wake up 15 minutes before the 6-hour limit to spawn the next runner
          sleep 18000
          
          echo "Triggering next relay runner for continuous 24/7 uptime..."
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/cloud_vps.yml/dispatches \
            -d '{"ref":"main"}' || true
          
          # Wait another 10 minutes to allow the new runner to spin up cleanly
          sleep 600
